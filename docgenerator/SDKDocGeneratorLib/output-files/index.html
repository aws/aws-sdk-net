<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AWS SDK for .NET Version 4 Documentation</title>
    <meta name="description" content="AWS SDK for .NET Version 4 API Reference Documentation">
    <meta name="guide-name" content="API Reference">
    <meta name="service-name" content="AWS SDK for .NET Version 4">
    <link rel="canonical" href="https://docs.aws.amazon.com/sdkfornet/v4/apidocs/index.html">
    <link rel="shortcut icon" href="favicon.ico"/>
    <script>
        /*
         * Bootstrap + legacy redirect shim.
         *
         * The doc set used to be a <frameset> driven by
         * index.html?page=<file>&tocid=<id>. Pages are now standalone
         * documents navigated in place by htmx, so this page only:
         *   1. Honors old ?page= bookmarks / RedirectWriter links by
         *      forwarding to the canonical /items/<page> URL, and
         *   2. Otherwise sends visitors to the landing page.
         */
        (function () {
            function parseQuery() {
                var q = {}, s = window.location.search.replace(/^\?/, "");
                if (!s) return q;
                s.split("&").forEach(function (pair) {
                    var kv = pair.split("=");
                    q[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
                });
                return q;
            }

            var params = parseQuery();
            var target;

            if (params.page) {
                // Generated filenames never contain underscores (FilenameGenerator
                // strips them at build time), so ?page= values are forwarded as-is.
                target = "./items/" + params.page;
            } else {
                target = "./items/sdk-api-home.html";
            }

            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <noscript>
        <p>This documentation requires JavaScript. Browse the
        <a href="./items/sdk-api-home.html">API Reference home page</a>.</p>
    </noscript>
    <p><a href="./items/sdk-api-home.html">Continue to the AWS SDK for .NET API Reference</a></p>
</body>
</html>
